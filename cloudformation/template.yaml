AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Alarms that carry their tags into EventBridge, one rule per team on alarmTags.Team,
  and catch-alls for alarms that match no team

Parameters:
  Environment:
    Type: String
    Default: prod
  NotificationEmail:
    Type: String
    Default: ''
    Description: Optional. Subscribes this address to all three topics so you can read the events

Conditions:
  HasEmail: !Not [!Equals [!Ref NotificationEmail, '']]

Resources:
  # Demo alarms. Fire one with: aws cloudwatch set-alarm-state --state-value ALARM ...
  # Only Team and Environment leave in the payload. CostCenter stays behind, because SNS shares tags with every subscriber.
  CheckoutErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sample-checkout-errors
      AlarmDescription: Demo alarm owned by payments
      Namespace: Sample/AlarmTags
      MetricName: CheckoutErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: Team
          Value: payments
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: cc-1234
      ActionConfiguration:
        AlarmTagsPropagation:
          Enabled: true
          IncludedTagKeys: [Team, Environment]

  SearchLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sample-search-latency
      AlarmDescription: Demo alarm owned by search
      Namespace: Sample/AlarmTags
      MetricName: SearchLatency
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 500
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: Team
          Value: search
        - Key: Environment
          Value: !Ref Environment
      ActionConfiguration:
        AlarmTagsPropagation:
          Enabled: true
          IncludedTagKeys: [Team, Environment]

  # The Team tag has a typo, so no team rule matches and UnknownTeamRule catches it.
  TypoTeamAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sample-typo-team
      AlarmDescription: Demo alarm with a misspelled Team tag
      Namespace: Sample/AlarmTags
      MetricName: RefundErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: Team
          Value: paymnets
        - Key: Environment
          Value: !Ref Environment
      ActionConfiguration:
        AlarmTagsPropagation:
          Enabled: true
          IncludedTagKeys: [Team, Environment]

  PaymentsTopic:
    Type: AWS::SNS::Topic
  SearchTopic:
    Type: AWS::SNS::Topic
  # Send this somewhere a person looks every day. An unmatched event is the new unmapped alarm.
  UnroutedTopic:
    Type: AWS::SNS::Topic

  PaymentsRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Alarms owned by payments
      EventPattern:
        source: [aws.cloudwatch]
        detail-type: [CloudWatch Alarm State Change]
        detail:
          state:
            value: [ALARM]
          alarmTags:
            Team: [payments]
            Environment: [!Ref Environment]
      Targets:
        - Id: payments
          Arn: !Ref PaymentsTopic

  SearchRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Alarms owned by search
      EventPattern:
        source: [aws.cloudwatch]
        detail-type: [CloudWatch Alarm State Change]
        detail:
          state:
            value: [ALARM]
          alarmTags:
            Team: [search]
            Environment: [!Ref Environment]
      Targets:
        - Id: search
          Arn: !Ref SearchTopic

  # Also catches alarms without propagation, and events whose tags CloudWatch couldn't read.
  NoTeamTagRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Alarms with no Team tag in the event
      EventPattern:
        source: [aws.cloudwatch]
        detail-type: [CloudWatch Alarm State Change]
        detail:
          state:
            value: [ALARM]
          alarmTags:
            Team:
              - exists: false
      Targets:
        - Id: unrouted
          Arn: !Ref UnroutedTopic

  # Add each new team here as well as giving it a rule above, or its pages go to both.
  UnknownTeamRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Alarms with a Team tag no rule handles, such as a typo
      EventPattern:
        source: [aws.cloudwatch]
        detail-type: [CloudWatch Alarm State Change]
        detail:
          state:
            value: [ALARM]
          alarmTags:
            Team:
              - anything-but: [payments, search]
      Targets:
        - Id: unrouted
          Arn: !Ref UnroutedTopic

  TopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref PaymentsTopic
        - !Ref SearchTopic
        - !Ref UnroutedTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource:
              - !Ref PaymentsTopic
              - !Ref SearchTopic
              - !Ref UnroutedTopic
            # Only this stack's rules can publish, not EventBridge rules in other accounts.
            Condition:
              ArnEquals:
                aws:SourceArn:
                  - !GetAtt PaymentsRule.Arn
                  - !GetAtt SearchRule.Arn
                  - !GetAtt NoTeamTagRule.Arn
                  - !GetAtt UnknownTeamRule.Arn

  PaymentsEmail:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref PaymentsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail
  SearchEmail:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref SearchTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail
  UnroutedEmail:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref UnroutedTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

Outputs:
  PaymentsTopicArn:
    Value: !Ref PaymentsTopic
  SearchTopicArn:
    Value: !Ref SearchTopic
  UnroutedTopicArn:
    Value: !Ref UnroutedTopic
